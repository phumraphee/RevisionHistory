[info]
name         = "Revision History"
version      = "1.0.3"
description  = "Revision history for items, item sets and media: who created, edited or deleted what and when, with every value before and after. Undo an edit, restore a deleted item, and keep a full audit trail of changes made in the admin, the API, batch edit and imports."
tags         = "history, revisions, audit trail, undo, restore, log"
license      = "GPL-3.0-or-later"
author       = "Phumraphee Sae-tang"
author_link  = "https://github.com/phumraphee"
module_link  = "https://github.com/phumraphee/RevisionHistory"
support_link = "https://github.com/phumraphee/RevisionHistory/issues"
configurable = true
omeka_version_constraint = "^4.0.0"
